name: Daily Data Pipeline

on:
  schedule:
    # Runs at 8:00 PM UTC every day (1:30 AM IST), after AMFI NAV updates
    - cron: '0 20 * * *'
  workflow_dispatch:  # Allows manual triggering from GitHub Actions UI

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    env:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      RF_ANNUAL_RATE: "0.065"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run daily pipeline commands
        run: |
          python manage.py populate_screener
          python manage.py ingest_benchmarks
          python manage.py populate_benchmark_returns
