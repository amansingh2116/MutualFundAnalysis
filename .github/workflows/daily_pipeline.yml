name: Daily Data Pipeline

# ─── Schedule ────────────────────────────────────────────────────────────────
# Runs at 8:30 PM UTC every day (~2:00 AM IST) — after AMFI NAV updates.
# (AMFI publishes NAVs by ~8 PM IST; we add a 30-min buffer.)
#
# WEEKDAY-SPLIT STRATEGY (solves the GitHub Actions 6-hour job limit)
# ─────────────────────────────────────────────────────────────────────────────
# Analytics takes ~50s/fund.  2,300 funds × 50s = 32 hours — way over the
# 6-hour limit.  We split into 7 equal shards (one per weekday) so each daily
# job processes only ~330 funds in ~4.5 hours — well within the limit.
# Every fund is refreshed once per week.
#
# --shard N --num-shards 7 selects every 7th fund starting at position N,
# ensuring perfectly equal slices regardless of AMFI code distribution.
on:
  schedule:
    - cron: '30 20 * * *'
  workflow_dispatch:
    inputs:
      shard:
        description: 'Shard index to process (0-6). Leave blank to use today''s day-of-week automatically.'
        required: false
        default: ''
      num_shards:
        description: 'Total number of shards (default 7 = weekly cycle)'
        required: false
        default: '7'
      limit:
        description: 'Optional fund limit per shard (0 or blank = no limit). Useful for quick tests.'
        required: false
        default: ''

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 360   # 6-hour hard cap — one weekday shard fits comfortably

    # ── Env vars shared across ALL steps ────────────────────────────────────
    env:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      RF_ANNUAL_RATE: "0.065"

    steps:
      # ── 1. Source & Python setup ─────────────────────────────────────────
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # ── 2. DB migrations ─────────────────────────────────────────────────
      # Always run first — applies any schema changes since the last pipeline.
      - name: Apply pending database migrations
        run: python manage.py migrate --no-input

      # ── 3. Fund universe ──────────────────────────────────────────────────
      # Syncs the ~2,300-scheme master list from AMFI. Fast: ~2–3 min.
      - name: Update fund universe
        run: python manage.py build_scheme_master

      # ── 4. Benchmark data ─────────────────────────────────────────────────
      # Incremental fetch — only new trading days. With bulk-insert: ~1–3 min.
      - name: Ingest benchmark data (incremental)
        run: python manage.py ingest_benchmarks

      - name: Recompute benchmark return snapshots
        run: python manage.py populate_benchmark_returns

      # ── 5. Fund screener pipeline (weekday shard) ─────────────────────────
      # --shard N --num-shards 7: process every 7th fund starting at position N.
      # This gives ~330 funds per shard with perfectly even distribution.
      # --resume: skip funds already processed today (safe if re-run manually).
      - name: Run fund data pipeline (today's shard)
        run: |
          # Resolve shard: use manual input if provided, else today's day-of-week
          # date +%w returns 0=Sun, 1=Mon, 2=Tue, ..., 6=Sat
          INPUT_SHARD="${{ github.event.inputs.shard }}"
          NUM_SHARDS="${{ github.event.inputs.num_shards }}"
          NUM_SHARDS="${NUM_SHARDS:-7}"
          LIMIT_ARG=""
          if [ -n "${{ github.event.inputs.limit }}" ] && [ "${{ github.event.inputs.limit }}" != "0" ]; then
            LIMIT_ARG="--limit=${{ github.event.inputs.limit }}"
          fi

          if [ -n "$INPUT_SHARD" ]; then
            SHARD="$INPUT_SHARD"
          else
            SHARD=$(date +%w)   # 0–6, matches Mon–Sun when num_shards=7
          fi

          echo "Running shard $SHARD of $NUM_SHARDS (day-of-week=$(date +%A))"
          python manage.py populate_screener \
            --shard="$SHARD" \
            --num-shards="$NUM_SHARDS" \
            $LIMIT_ARG \
            --resume --resume-hours=20

      # ── 6. Learn content sync ─────────────────────────────────────────────
      # Fast (<10 s) and idempotent — syncs PDF guides and blog metadata.
      - name: Sync Learn section content
        run: python manage.py sync_content
