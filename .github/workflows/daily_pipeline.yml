name: Daily Data Pipeline

# ─── Schedule ────────────────────────────────────────────────────────────────
# Runs at 8:30 PM UTC every day (~2:00 AM IST) — after AMFI NAV updates.
# (AMFI publishes NAVs by ~8 PM IST; we add a 30-min buffer.)
#
# 10-SHARD ROLLING STRATEGY (solves the GitHub Actions 6-hour job limit)
# ─────────────────────────────────────────────────────────────────────────────
# Analytics runs at ~60s/fund.  With 2,300 funds × 60s = 38 hours — way over
# the 6-hour limit.  We split into 10 rolling shards so each daily job handles
# only ~230 funds (~3.8 hours) — well within the limit.
#
# Shard selection: day-of-year modulo 10. This gives a deterministic, evenly
# distributed 10-day rolling cycle:  all funds processed once every ~10 days.
#
# --time-limit-minutes=310: command stops gracefully at 5h 10m, leaving 50min
# for fund universe sync, benchmark ingestion, content sync, and cleanup.
# Any unprocessed shard remainder is handled by the next same-shard run.
on:
  schedule:
    - cron: '30 20 * * *'
  workflow_dispatch:
    inputs:
      shard:
        description: 'Shard index to process (0-9). Leave blank to use rolling day-of-year calc.'
        required: false
        default: ''
      num_shards:
        description: 'Total number of shards (default 10 for 10-day rolling cycle)'
        required: false
        default: '10'
      limit:
        description: 'Optional fund limit per shard (0 or blank = no limit). Useful for quick tests.'
        required: false
        default: ''
      time_limit_minutes:
        description: 'Stop fund pipeline after N minutes (default 310, set 0 to disable)'
        required: false
        default: '310'

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 370   # 6h 10m — gives 60min buffer beyond the 310-min fund limit

    # ── Env vars shared across ALL steps ────────────────────────────────────
    env:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      RF_ANNUAL_RATE: "0.065"

    steps:
      # ── 1. Source & Python setup ─────────────────────────────────────────
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # ── 2. DB migrations ─────────────────────────────────────────────────
      # Always run first — applies any schema changes since the last pipeline.
      - name: Apply pending database migrations
        run: python manage.py migrate --no-input

      # ── 3. Fund universe ──────────────────────────────────────────────────
      # Syncs the ~2,300-scheme master list from AMFI. Fast: ~2–3 min.
      - name: Update fund universe
        run: python manage.py build_scheme_master

      # ── 4. Benchmark data ─────────────────────────────────────────────────
      # Incremental fetch — only new trading days. With bulk-insert: ~1–3 min.
      - name: Ingest benchmark data (incremental)
        run: python manage.py ingest_benchmarks

      - name: Recompute benchmark return snapshots
        run: python manage.py populate_benchmark_returns

      # ── 5. Fund screener pipeline (10-shard rolling cycle) ────────────────
      # Uses day-of-year mod 10 for rolling shard selection.
      # --time-limit-minutes=310 exits gracefully before the 6h GA cap.
      # --resume --resume-hours=20 skips funds already done today (safe re-run).
      - name: Run fund data pipeline (rolling shard)
        run: |
          # Resolve shard: use manual input if provided, else day-of-year mod 10.
          # Day-of-year (1–366) gives a natural rolling 10-day cycle.
          INPUT_SHARD="${{ github.event.inputs.shard }}"
          NUM_SHARDS="${{ github.event.inputs.num_shards }}"
          NUM_SHARDS="${NUM_SHARDS:-10}"
          TIME_LIMIT="${{ github.event.inputs.time_limit_minutes }}"
          TIME_LIMIT="${TIME_LIMIT:-310}"

          LIMIT_ARG=""
          if [ -n "${{ github.event.inputs.limit }}" ] && [ "${{ github.event.inputs.limit }}" != "0" ]; then
            LIMIT_ARG="--limit=${{ github.event.inputs.limit }}"
          fi

          if [ -n "$INPUT_SHARD" ]; then
            SHARD="$INPUT_SHARD"
          else
            # day-of-year mod num_shards gives a rolling cycle covering every shard
            DOY=$(python3 -c "from datetime import date; print(date.today().timetuple().tm_yday)")
            SHARD=$((DOY % NUM_SHARDS))
          fi

          echo "Running shard $SHARD of $NUM_SHARDS ($(date +%A), day-of-year=$(python3 -c 'from datetime import date; print(date.today().timetuple().tm_yday)'), time-limit=${TIME_LIMIT}min)"

          python manage.py populate_screener \
            --shard="$SHARD" \
            --num-shards="$NUM_SHARDS" \
            $LIMIT_ARG \
            --skip-analytics-if-no-new-nav \
            --resume --resume-hours=20 \
            --time-limit-minutes="$TIME_LIMIT"

      # ── 6. Learn content sync ─────────────────────────────────────────────
      # Fast (<10 s) and idempotent — syncs PDF guides and blog metadata.
      # This step always runs (even if the fund pipeline hit its time limit)
      # because the fund step exits gracefully via --time-limit-minutes.
      - name: Sync Learn section content
        run: python manage.py sync_content
