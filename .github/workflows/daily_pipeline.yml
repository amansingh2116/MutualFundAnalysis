name: Daily Data Pipeline

# ─── Schedule ────────────────────────────────────────────────────────────────
# Runs at 8:30 PM UTC every day (~2:00 AM IST) — after AMFI NAV updates
# (AMFI publishes NAVs by ~8 PM IST; we add a 30-min buffer).
# Can also be triggered manually from the Actions tab at any time.
on:
  schedule:
    - cron: '30 20 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Fund limit for populate_screener (0 = all ~2300 funds, 300 for a quick run)'
        required: false
        default: '0'

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 420   # 7-hour cap — full 2300-fund pass can take 4–6 hrs

    # ── Env vars shared across ALL steps ────────────────────────────────────
    # Set DJANGO_SETTINGS_MODULE here so every manage.py call uses prod
    # settings automatically — no need for a --settings flag anywhere.
    env:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      RF_ANNUAL_RATE: "0.065"

    steps:
      # ── 1. Source & Python setup ─────────────────────────────────────────
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # ── 2. DB migrations ─────────────────────────────────────────────────
      # Always run first — applies any schema changes deployed since the last
      # pipeline run.  Safe to call even when nothing is pending.
      - name: Apply pending database migrations
        run: python manage.py migrate --no-input

      # ── 3. Fund universe ──────────────────────────────────────────────────
      # Syncs the ~2,300-scheme master list from AMFI (new/renamed funds, status
      # changes).  Fast: ~2–3 min.
      - name: Update fund universe
        run: python manage.py build_scheme_master

      # ── 4. Benchmark data ─────────────────────────────────────────────────
      # Incremental fetch: only downloads trading days not yet in DB.
      # With bulk-insert this takes ~1–3 min for all benchmarks combined.
      - name: Ingest benchmark data (incremental)
        run: python manage.py ingest_benchmarks

      - name: Recompute benchmark return snapshots
        run: python manage.py populate_benchmark_returns

      # ── 5. Fund screener pipeline ─────────────────────────────────────────
      # Fetches only new NAV rows (incremental — uses ?startDate=<last_db_date>).
      # Re-fetches metadata if older than 7 days (built-in staleness check).
      # Recomputes all analytics + FundScreenerSnapshot + FundModelScore.
      #
      # --resume skips any fund whose snapshot was updated in the last 24 h
      # (safe guard if the pipeline is re-run on the same day).
      - name: Run fund data pipeline
        run: |
          LIMIT="${{ github.event.inputs.limit }}"
          LIMIT="${LIMIT:-0}"
          if [ "$LIMIT" = "0" ]; then
            echo "Running full populate_screener for all funds..."
            python manage.py populate_screener --resume
          else
            echo "Running populate_screener with --limit=$LIMIT..."
            python manage.py populate_screener --limit="$LIMIT" --resume
          fi

      # ── 6. Learn content sync ─────────────────────────────────────────────
      # Syncs PDF guide and blog metadata from the Resources/ folder.
      # Fast: <10 s.  Safe to run daily (idempotent).
      - name: Sync Learn section content
        run: python manage.py sync_content
