name: Weekly Data Pipeline

# ═══════════════════════════════════════════════════════════════════════════════
# WEEKLY BATCH STRATEGY — how it works
# ═══════════════════════════════════════════════════════════════════════════════
#
# GitHub Actions is FREE for PUBLIC repositories (unlimited minutes).
# For private repos the limit is 2,000 min/month, which this pipeline exceeds.
# → The repository should be public to run this pipeline without limits.
#
# All ~2,300 funds are processed in 6 equal daily batches (Mon–Sat).
# Each batch covers a contiguous slice of funds ordered by AMFI code:
#
#   Mon  8:30 PM UTC  →  funds   0 – 383   (384 funds)
#   Tue  8:30 PM UTC  →  funds 384 – 767   (384 funds)
#   Wed  8:30 PM UTC  →  funds 768 – 1151  (384 funds)
#   Thu  8:30 PM UTC  →  funds 1152 – 1535 (384 funds)
#   Fri  8:30 PM UTC  →  funds 1536 – 1919 (384 funds)
#   Sat  8:30 PM UTC  →  funds 1920 – end  (~380 funds)
#   Sun  8:30 PM UTC  →  benchmarks + content ONLY (no fund pipeline)
#
# --offset=N skips the first N funds in the ordered queryset.
# --limit=384 caps each batch.  Together they give a precise SQL OFFSET+LIMIT.
# --time-limit-minutes=310 exits gracefully at 5h 10m so sync_content always runs.
# --resume --resume-hours=23 allows safe same-day re-runs (skip already done).
#
# RESUMING: If a batch is killed before finishing, simply re-run the same
# workflow_dispatch with the same day/offset — --resume skips completed funds.
# The following day's batch starts fresh from its own offset regardless.
#
# WEEKLY RESTART: Monday always starts at offset=0.  All funds cycle once a week.
# ═══════════════════════════════════════════════════════════════════════════════

on:
  schedule:
    - cron: '30 20 * * *'   # 8:30 PM UTC every day = 2:00 AM IST next morning
  workflow_dispatch:
    inputs:
      day_override:
        description: >
          Force a specific day (1=Mon … 6=Sat, 7=Sun). Leave blank to use today.
        required: false
        default: ''
      limit:
        description: 'Funds per batch (default 384). Set smaller for quick tests.'
        required: false
        default: '384'
      time_limit_minutes:
        description: 'Stop fund pipeline after N minutes (default 310, 0=no limit).'
        required: false
        default: '310'

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 375   # 6h 15m — fund limit is 310 min + overhead

    env:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SECRET_KEY:   ${{ secrets.SECRET_KEY }}
      RF_ANNUAL_RATE: "0.065"

    steps:
      # ── 1. Source & Python ────────────────────────────────────────────────
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # ── 2. DB migrations ─────────────────────────────────────────────────
      - name: Apply pending database migrations
        run: python manage.py migrate --no-input

      # ── 3. Fund universe ──────────────────────────────────────────────────
      # ~2 min — syncs the AMFI scheme master list.
      - name: Update fund universe
        run: python manage.py build_scheme_master

      # ── 4. Benchmark data ─────────────────────────────────────────────────
      # Incremental — fetches only new trading-day rows. ~1-3 min.
      - name: Ingest benchmark data (incremental)
        run: python manage.py ingest_benchmarks

      - name: Recompute benchmark return snapshots
        run: python manage.py populate_benchmark_returns

      # ── 5. Fund screener pipeline (weekly batch) ──────────────────────────
      # Compute batch offset from the day of week.
      # Sunday (DOW=7): skip fund pipeline — benchmarks + content only.
      - name: Run fund data pipeline (weekly batch)
        run: |
          # ── Resolve day of week (1=Mon … 6=Sat, 7=Sun) ──────────────────
          OVERRIDE="${{ github.event.inputs.day_override }}"
          if [ -n "$OVERRIDE" ]; then
            DOW="$OVERRIDE"
          else
            DOW=$(date +%u)    # ISO weekday: 1=Mon, 2=Tue, …, 7=Sun
          fi

          BATCH_SIZE="${{ github.event.inputs.limit }}"
          BATCH_SIZE="${BATCH_SIZE:-384}"

          TIME_LIMIT="${{ github.event.inputs.time_limit_minutes }}"
          TIME_LIMIT="${TIME_LIMIT:-310}"

          echo "=== Day of week: $DOW | Batch size: $BATCH_SIZE | Time limit: ${TIME_LIMIT}min ==="

          # ── Sunday: skip fund pipeline ───────────────────────────────────
          if [ "$DOW" = "7" ]; then
            echo "Sunday — benchmark and content update only. No fund pipeline today."
            exit 0
          fi

          # ── Calculate positional offset ─────────────────────────────────
          # Mon=0, Tue=384, Wed=768, Thu=1152, Fri=1536, Sat=1920
          OFFSET=$(( (DOW - 1) * BATCH_SIZE ))

          echo "Processing batch: offset=$OFFSET, limit=$BATCH_SIZE (funds $OFFSET to $((OFFSET + BATCH_SIZE - 1)))"

          python manage.py populate_screener \
            --offset="$OFFSET" \
            --limit="$BATCH_SIZE" \
            --resume --resume-hours=23 \
            --time-limit-minutes="$TIME_LIMIT"

      # ── 6. Learn content sync ─────────────────────────────────────────────
      # Fast (<10 s) — runs every day including Sunday.
      # Always runs because the fund step exits gracefully via --time-limit-minutes
      # (it never gets hard-killed by GitHub Actions).
      - name: Sync Learn section content
        run: python manage.py sync_content
