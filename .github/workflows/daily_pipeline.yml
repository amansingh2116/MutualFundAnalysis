name: Weekly Data Pipeline

# ═══════════════════════════════════════════════════════════════════════════════
# HOW THE PIPELINE WORKS
# ═══════════════════════════════════════════════════════════════════════════════
#
# The pipeline runs every 6 hours (4 times per day) — FREE for public repos.
# Each run processes as many funds as it can within 5h 10min, then stops.
# Funds are skipped once updated (--resume --resume-hours=167 = 7-day window).
#
# SELF-COMPLETING WEEKLY CYCLE:
#   Run 1  (Day 1, +0h):    ~250–350 funds updated, then time-limit hit
#   Run 2  (Day 1, +6h):    next ~250–350 funds (resume skips done funds)
#   Run 3  (Day 2, +12h):   continues...
#   ...
#   Run 7–9 (Day 2–3):      ALL ~2,300 funds updated ✅
#   Run 10+ (Days 3–7):     finds 0 stale funds, completes in < 5 minutes 💤
#   Next week (Day 8):      7-day window expires → full automatic restart 🔄
#
# GUARANTEES:
#   - All ~2,300 funds refreshed within 2–3 days of each week
#   - Self-healing: a failed run is retried automatically 6 hours later
#   - Zero manual intervention needed week-to-week
#   - Benchmarks and content sync run on EVERY invocation (they're fast)
#
# REQUIREMENTS:
#   - Repository must be PUBLIC (GitHub Actions is free for public repos)
#   - GitHub Secrets: DATABASE_URL and SECRET_KEY must be set
#
# ═══════════════════════════════════════════════════════════════════════════════

on:
  schedule:
    - cron: '30 */6 * * *'  # Every 6 hours: 12:30 AM, 6:30 AM, 12:30 PM, 6:30 PM UTC
  workflow_dispatch:
    inputs:
      time_limit_minutes:
        description: 'Stop fund pipeline after N minutes (default 310, 0 = no limit)'
        required: false
        default: '310'
      resume_hours:
        description: 'Skip funds updated within the last N hours (default 167 = 7 days)'
        required: false
        default: '167'
      limit:
        description: 'Cap total funds processed this run (default 0 = no cap)'
        required: false
        default: '0'

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 375   # 6h 15m hard cap; fund pipeline soft-exits at 310min

    env:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SECRET_KEY:   ${{ secrets.SECRET_KEY }}
      RF_ANNUAL_RATE: "0.065"

    steps:
      # ── 1. Source & Python ────────────────────────────────────────────────
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # ── 2. Data source contract checks ──────────────────────────────────
      # Fast (~30s) — validates live AMFI, mfapi.in, and captnemo.in schemas.
      # Detects API format changes (e.g. column count shifts) before they cause
      # silent data corruption downstream. Skips NSE (nselib is slow in CI).
      # continue-on-error: true → warns loudly via GH annotations but does NOT
      # block the pipeline for non-critical changes.
      - name: Check data source contracts
        run: python manage.py check_data_sources --skip-nse
        continue-on-error: true

      # ── 3. DB migrations ─────────────────────────────────────────────────
      - name: Apply pending database migrations
        run: python manage.py migrate --no-input

      # ── 4. Fund universe ──────────────────────────────────────────────────
      # ~1–2 min — incremental AMFI scheme list sync.
      - name: Sync fund universe (AMFI master list)
        run: python manage.py build_scheme_master

      # ── 5. Benchmark data ─────────────────────────────────────────────────
      # Incremental — fetches only new trading-day rows. ~1–3 min.
      - name: Ingest benchmark NAVs (incremental)
        run: python manage.py ingest_benchmarks

      - name: Recompute benchmark return snapshots
        run: python manage.py populate_benchmark_returns

      # ── 6. Fund screener pipeline (resume-based, self-completing) ─────────
      # --resume --resume-hours=167: skips funds updated in the last 7 days.
      # --time-limit-minutes=310:    exits gracefully before the 6h job timeout.
      # No offset/limit needed: resume mode automatically picks up where the
      # last run stopped, ordered by amfi_code.
      # When all funds are up-to-date, this step completes in < 5 minutes.
      - name: Run fund data pipeline (resume-based weekly cycle)
        run: |
          TIME_LIMIT="${{ github.event.inputs.time_limit_minutes }}"
          TIME_LIMIT="${TIME_LIMIT:-310}"

          RESUME_HOURS="${{ github.event.inputs.resume_hours }}"
          RESUME_HOURS="${RESUME_HOURS:-167}"

          LIMIT_ARG=""
          RAW_LIMIT="${{ github.event.inputs.limit }}"
          RAW_LIMIT="${RAW_LIMIT:-0}"
          if [ "$RAW_LIMIT" != "0" ]; then
            LIMIT_ARG="--limit=$RAW_LIMIT"
          fi

          echo "=== Pipeline run ==="
          echo "  Resume window : ${RESUME_HOURS}h (skip funds updated in last ${RESUME_HOURS}h)"
          echo "  Time limit    : ${TIME_LIMIT}min (exits gracefully before 6h job cap)"
          echo "  Limit         : ${RAW_LIMIT:-none} (0 = no cap)"
          echo "  Time          : $(date -u '+%Y-%m-%d %H:%M UTC')"
          echo "===================="

          python manage.py populate_screener \
            --resume \
            --resume-hours="$RESUME_HOURS" \
            --time-limit-minutes="$TIME_LIMIT" \
            $LIMIT_ARG

      # ── 7. Learn content sync ─────────────────────────────────────────────
      # Fast (< 10 s) — always runs. Safe because fund pipeline exits gracefully.
      - name: Sync Learn section content
        run: python manage.py sync_content

      # ── 8. Score trend snapshot ───────────────────────────────────────────
      # Stores each fund's model score and category rank for the current week
      # in FundScoreTrend (keyed by as_of_week — idempotent). Powers the
      # Score & Rank Trend chart on the fund detail Portfolio tab.
      - name: Ingest weekly score trend snapshot
        run: python manage.py ingest_score_trend
        continue-on-error: true   # Non-fatal; screener may still be running
