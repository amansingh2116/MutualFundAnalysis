name: Monthly Data Pipeline

# =====================================================================
# HOW THE MONTHLY PIPELINE WORKS
# =====================================================================
#
# Runs on the 5th of each month at 3:00 AM UTC.
#
# WHAT IT INGESTS (in order):
#   1. update_nifty_caplist    -- Nifty 50 / Next 50 / Midcap 150 refresh
#   2. ingest_holdings         -- Monthly portfolio disclosures (all active funds)
#   3. ingest_aum_snapshots    -- Point-in-time AUM snapshot for all schemes
#   4. ingest_industry_inflows -- AMFI category-level net inflow data (last 3 mo)
#   5. ingest_score_trend      -- Weekly score/rank snapshot (idempotent; fast)
#
# PORTFOLIO HOLDINGS STRATEGY (ingest_holdings):
#   Sources in priority order (no browser/Selenium required):
#   1. Morningstar REST API  — plain HTTP using Scheme.morningstar_id (F0...SecId)
#      Same API as the fund detail Portfolio tab. Requires morningstar_id populated.
#   2. yahooquery FALLBACK   — Top-10 holdings + sector weights for ETFs or
#      funds without a morningstar_id.
#   3. CapClassifier         — Maps holdings → Large/Mid/Small cap via rapidfuzz
#      fuzzy matching against data/nifty_caplist.json (runs after any source).
#
#   PREREQUISITE (one-time, not in this workflow):
#     python manage.py build_mstar_ids
#   This command uses mstarpy (Selenium) to populate Scheme.morningstar_id for
#   all active equity/hybrid funds. Run once on any machine with Chrome, then
#   ingest_holdings uses pure HTTP REST forever.
#
# DATA RETENTION:
#   Holdings (Holding, SectorAllocation, MarketCapAllocation) retain last 3
#   months automatically — ingest_holdings uses update_or_create keyed by
#   (scheme, as_of_month) so re-running is safe and idempotent.
#
# DOWNSTREAM:
#   The next weekly populate_screener run picks up new large_pct / mid_pct /
#   small_pct / top_sector / aum_1m_change_pct for all FundScreenerSnapshot rows.
#
# REQUIREMENTS: DATABASE_URL and SECRET_KEY GitHub Secrets must be set.
# =====================================================================

on:
  schedule:
    - cron: '0 3 5 * *'
  workflow_dispatch:
    inputs:
      inflow_months:
        description: 'Months of industry inflow data to fetch (default 6)'
        required: false
        default: '6'
      holdings_source:
        description: 'Holdings data source: auto (morningstar→yahoo), morningstar, yahoo'
        required: false
        default: 'auto'

jobs:
  monthly-ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 180   # Increased from 120 — ingest_holdings can take 1-2h for ~2300 funds

    env:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SECRET_KEY:   ${{ secrets.SECRET_KEY }}
      RF_ANNUAL_RATE: "0.065"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Apply pending database migrations
        run: python manage.py migrate --no-input

      # -- 1. Refresh Nifty cap-list (SEBI cap classification accuracy) -------
      # Fast (~10s). Updates data/nifty_caplist.json from NSE.
      # Used by CapClassifier in ingest_holdings to map stocks → Large/Mid/Small.
      - name: Refresh Nifty cap-list
        run: python manage.py update_nifty_caplist
        continue-on-error: true

      # -- 2. Ingest monthly portfolio holdings --------------------------------
      # Downloads SEBI-mandated portfolio disclosures for all active direct-growth funds.
      # Morningstar REST API (primary, plain HTTP) + yahooquery (fallback).
      # CapClassifier maps holdings to SEBI cap classifications (Large/Mid/Small).
      # update_or_create keyed by (scheme, as_of_month) -- safe to re-run.
      - name: Ingest portfolio holdings
        run: |
          SOURCE="${{ github.event.inputs.holdings_source }}"
          SOURCE="${SOURCE:-auto}"
          echo "=== Monthly Portfolio Holdings Ingest ==="
          echo "  Source: ${SOURCE}"
          echo "  Date: $(date -u '+%Y-%m-%d %H:%M UTC')"
          python manage.py ingest_holdings --source="${SOURCE}" --resume
        continue-on-error: true  # Non-fatal: existing portfolio data stays intact

      # -- 3. AUM snapshots ---------------------------------------------------
      # Snapshots current AUM from AMFI for all active schemes (SchemeAumSnapshot).
      # Used by fund AUM trend chart and aum_1m_change_pct screener column.
      - name: Ingest AUM snapshots
        run: python manage.py ingest_aum_snapshots
        continue-on-error: true

      # -- 4. AMFI industry inflows -------------------------------------------
      # Fetches category-level gross purchase, gross redemption, net inflow
      # from AMFI into IndustryInflow model. Shown on Home page Capital Flows widget.
      - name: Ingest AMFI industry inflows
        run: |
          INFLOW_MONTHS="${{ github.event.inputs.inflow_months }}"
          INFLOW_MONTHS="${INFLOW_MONTHS:-6}"
          echo "=== AMFI Industry Inflows: last ${INFLOW_MONTHS} months ==="
          python manage.py ingest_industry_inflows --months="${INFLOW_MONTHS}"
        continue-on-error: true

      # -- 5. Score trend snapshot --------------------------------------------
      # Records each fund's model score and category rank for the current week
      # in FundScoreTrend (keyed by as_of_week — idempotent). Completes in ~1 min.
      # Powers the Score & Rank Trend chart on the fund detail Portfolio tab.
      - name: Ingest weekly score trend snapshot
        run: python manage.py ingest_score_trend
        continue-on-error: true