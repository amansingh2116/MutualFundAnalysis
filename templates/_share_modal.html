<!-- Global Floating Share Button & Modal -->
<div id="global-share-widget" class="global-share-widget">
  <!-- Floating Action Button -->
  <button id="global-share-fab" class="global-share-fab" type="button" aria-label="Share this page" title="Share this page" aria-expanded="false" aria-controls="global-share-modal">
    <span class="share-fab-icon">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="18" cy="5" r="3"></circle>
        <circle cx="6" cy="12" r="3"></circle>
        <circle cx="18" cy="19" r="3"></circle>
        <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
        <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
      </svg>
    </span>
    <span class="share-fab-label">Share</span>
  </button>

  <!-- Share Modal / Popup Card -->
  <div id="global-share-modal" class="global-share-modal" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="share-modal-title">
    <div class="share-modal-header">
      <div class="share-modal-title-wrap">
        <span class="share-modal-badge">📢 Share</span>
        <h3 id="share-modal-title" class="share-modal-title">Share this page</h3>
      </div>
      <button id="global-share-close" class="share-modal-close" type="button" aria-label="Close share popup">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <div class="share-modal-body">
      <!-- Page Context Preview -->
      <div class="share-context-preview">
        <div class="share-context-title" id="share-context-title">Mutual Fund Analysis</div>
        <div class="share-context-url" id="share-context-url"></div>
      </div>

      <!-- Quick Copy Link Box -->
      <div class="share-copy-box">
        <input type="text" id="share-link-input" class="share-link-input" readonly value="">
        <button type="button" id="share-copy-btn" class="share-copy-btn" title="Copy Link">
          <span id="share-copy-text">Copy</span>
        </button>
      </div>
