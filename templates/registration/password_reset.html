{% extends "base.html" %}
{% block title %}Forgot Password — MF Analysis{% endblock %}
{% block hide_layout %}True{% endblock %}

{% block content %}
<div class="auth-wrapper" style="min-height: calc(100vh - 150px); background: transparent;">
  <div class="auth-card">
    <div class="auth-logo">
      <div style="width:48px;height:48px;background:var(--accent);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;color:white;margin:0 auto 12px">M</div>
    </div>
    <h1 class="auth-title">Forgot your password?</h1>
    <p class="auth-sub">Enter your email and we'll send you a reset link.</p>

    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label class="form-label" for="id_email">Email address</label>
        <input class="form-control" type="email" id="id_email" name="email"
               required autofocus placeholder="you@example.com" autocomplete="email">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;margin-top:8px">
        Send Reset Link →
      </button>
    </form>

    <p style="text-align:center;margin-top:20px;font-size:12px;color:var(--text-muted)">
      Remember it? <a href="{% url 'login' %}" style="color:var(--indigo-400);text-decoration:none">Sign in →</a>
    </p>
    <p style="text-align:center;margin-top:8px;font-size:12px;color:var(--text-muted)">
      <a href="{% url 'funds:home' %}" style="color:var(--text-secondary);text-decoration:none">← Back to Home</a>
    </p>
  </div>
</div>
{% endblock %}
