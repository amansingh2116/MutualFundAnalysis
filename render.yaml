databases:
  - name: mfanalysis-db
    databaseName: mfanalysis
    user: mfanalysis
    plan: free

services:
  - type: web
    name: mfanalysis-web
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn config.wsgi:application --workers 2 --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: mfanalysis-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: DEBUG
        value: "False"
      - key: RF_ANNUAL_RATE
        value: "0.065"
      # ── Email (fill values manually in Render dashboard) ──────────────────
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false   # set this manually — never commit the real password
      - key: DEFAULT_FROM_EMAIL
        sync: false   # e.g. noreply@yourdomain.com (must be verified in your SMTP provider)
      - key: CONTACT_RECIPIENT_EMAIL
        sync: false   # your personal inbox for contact-form messages
    autoDeploy: true

  - type: worker
    name: mfanalysis-worker
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py qcluster
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: mfanalysis-db
          property: connectionString
