services:
  # ── Web Service ───────────────────────────────────────────────────────────────
  - type: web
    name: mfanalysis-web
    env: python
    # build.sh installs Chromium (for PDF generation) then pip installs Python deps
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: gunicorn config.wsgi:application --workers 2 --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false   # Paste CockroachDB connection string from cockroachlabs.cloud
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: DEBUG
        value: "False"
      - key: RF_ANNUAL_RATE
        value: "0.065"
      # ── Email (fill values manually in Render dashboard) ──────────────────
      - key: EMAIL_HOST
        sync: false   # e.g. smtp.sender.net  or  smtp.gmail.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false   # Set manually — never commit the real password
      - key: DEFAULT_FROM_EMAIL
        sync: false   # e.g. noreply@yourdomain.com (verified in your SMTP provider)
      - key: CONTACT_RECIPIENT_EMAIL
        sync: false   # Your personal inbox for contact-form messages
    autoDeploy: true

  # ── Daily Data Pipeline Cron Job (free on Render) ─────────────────────────────
  # Runs at 8:00 PM UTC = 1:30 AM IST, after AMFI publishes daily NAVs.
  # Does NOT install Chromium (not needed for data pipeline — saves 2–3 min of build time).
  - type: cron
    name: mfanalysis-daily-pipeline
    env: python
    schedule: "0 20 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: >-
      python manage.py populate_screener &&
      python manage.py ingest_benchmarks &&
      python manage.py populate_benchmark_returns
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: SECRET_KEY
        sync: false   # Same value as web service — set manually
      - key: DATABASE_URL
        sync: false   # Same CockroachDB URL as web service — set manually
